Reports variables which hide another variable of an outer scope.
<p>Example:</p>
<pre><code>x: let x = 1; in x</code></pre>
<p>This inspection requires the symbol support of NixIDEA, which is currently a preview feature.
You can enable it in <em>Settings | Languages &amp; Frameworks | Nix | Symbols</em>.</p>
